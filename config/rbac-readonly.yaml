apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-triage-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-triage-readonly
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-triage-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-triage-readonly
subjects:
- kind: ServiceAccount
  name: k8s-triage-agent
  namespace: default
